name: Python regression tests

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches: [main]
    paths:
      - "quet_vb.py"
      - "scanner/**"
      - "tests/**"
      - "requirements.txt"
      - "source_config.json"
      - "danh_sach_nguon.csv"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and run regression tests
        run: |
          python -m compileall -q scanner quet_vb.py
          python -m unittest discover -s tests -v
