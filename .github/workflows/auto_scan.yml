name: Tram Tin Tuc - Auto Scanner

# GitHub-only controller: priority scan no sooner than 5 minutes after the
# previous completion; full scan on a 30-minute cadence with safe catch-up.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Phạm vi quét"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - priority
          - priority_only
          - full_only

permissions:
  actions: write
  contents: write

jobs:
  scan:
    needs: priority-scan
    if: ${{ always() && ((needs.priority-scan.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || (github.event_name == 'workflow_dispatch' && inputs.profile == 'full_only')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: tram-tin-tuc-full-scan
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python, tests, configuration and Apps Script syntax
        run: |
          python -m compileall -q scanner quet_vb.py
          python -m json.tool source_config.json > /dev/null
          python -m json.tool priority_sources.json > /dev/null
          python -m unittest discover -s tests -v
          cp apps_script/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          node --check scripts/github_scheduler.js

      - name: Run non-priority source scanner
        env:
          SHEETS_WEB_APP_URL: ${{ secrets.SHEETS_WEB_APP_URL }}
          SHEETS_API_TOKEN: ${{ secrets.SHEETS_API_TOKEN }}
          SCAN_PROFILE: remaining
          SCAN_TRIGGER: ${{ github.event.schedule || github.event_name }}
        run: python quet_vb.py

      - name: Save persistent scanner memory
        if: always()
        run: |
          MEMORY_FILES="data/seen_documents.json data/scan_history.json data/document_relationships.json data/relationship_scan_state.json data/review_queue.json data/sheets_export_queue.json data/discovered_sources.json data/source_retry_queue.json data/sheets_bootstrap.json"
          if [[ -n "$(git status --porcelain $MEMORY_FILES)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p /tmp/scanner-memory-local
            for file in $MEMORY_FILES; do
              if [[ -f "$file" ]]; then
                mkdir -p "/tmp/scanner-memory-local/$(dirname "$file")"
                cp "$file" "/tmp/scanner-memory-local/$file"
              fi
            done

            # Merge JSON state onto the newest main instead of rebasing conflicting JSON blobs.
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              python -m scanner.state_merge --local-dir /tmp/scanner-memory-local --repo-root .
              for file in $MEMORY_FILES; do
                if [[ -f "$file" ]]; then git add "$file"; fi
              done
              if git diff --cached --quiet; then
                echo "Không có thay đổi bộ nhớ cần lưu."
                exit 0
              fi
              git commit -m "Merge persistent scanner memory [skip ci]"
              if git push origin HEAD:main; then
                echo "Đã hợp nhất và lưu bộ nhớ quét lên main."
                exit 0
              fi
              echo "Push bộ nhớ thất bại lần ${attempt}/3; thử lấy main mới nhất."
              sleep $((attempt * 3))
            done
            echo "Không thể lưu bộ nhớ sau 3 lần thử."
            exit 1
          fi

  priority-scan:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.profile == 'priority' || inputs.profile == 'full' || inputs.profile == 'priority_only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: tram-tin-tuc-priority-scan
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python, tests, configuration and Apps Script syntax
        run: |
          python -m compileall -q scanner quet_vb.py
          python -m json.tool source_config.json > /dev/null
          python -m json.tool priority_sources.json > /dev/null
          python -m unittest discover -s tests -v
          cp apps_script/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          node --check scripts/github_scheduler.js

      - name: Run priority-source scanner
        env:
          SHEETS_WEB_APP_URL: ${{ secrets.SHEETS_WEB_APP_URL }}
          SHEETS_API_TOKEN: ${{ secrets.SHEETS_API_TOKEN }}
          SCAN_PROFILE: priority
          SCAN_TRIGGER: ${{ github.event.schedule || github.event_name }}
        run: python quet_vb.py

      - name: Save persistent scanner memory
        if: always()
        run: |
          MEMORY_FILES="data/seen_documents.json data/scan_history.json data/document_relationships.json data/relationship_scan_state.json data/review_queue.json data/sheets_export_queue.json data/discovered_sources.json data/source_retry_queue.json data/sheets_bootstrap.json"
          if [[ -n "$(git status --porcelain $MEMORY_FILES)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p /tmp/scanner-memory-local
            for file in $MEMORY_FILES; do
              if [[ -f "$file" ]]; then
                mkdir -p "/tmp/scanner-memory-local/$(dirname "$file")"
                cp "$file" "/tmp/scanner-memory-local/$file"
              fi
            done

            # Merge JSON state onto the newest main instead of rebasing conflicting JSON blobs.
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              python -m scanner.state_merge --local-dir /tmp/scanner-memory-local --repo-root .
              for file in $MEMORY_FILES; do
                if [[ -f "$file" ]]; then git add "$file"; fi
              done
              if git diff --cached --quiet; then
                echo "Không có thay đổi bộ nhớ cần lưu."
                exit 0
              fi
              git commit -m "Merge persistent scanner memory [skip ci]"
              if git push origin HEAD:main; then
                echo "Đã hợp nhất và lưu bộ nhớ quét lên main."
                exit 0
              fi
              echo "Push bộ nhớ thất bại lần ${attempt}/3; thử lấy main mới nhất."
              sleep $((attempt * 3))
            done
            echo "Không thể lưu bộ nhớ sau 3 lần thử."
            exit 1
          fi

  schedule-watchdog:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: tram-tin-tuc-scheduler-controller
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout scheduler code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check scan health and dispatch a catch-up run when needed
        uses: actions/github-script@v7
        with:
          script: |
            const runScheduler = require("./scripts/github_scheduler.js");
            await runScheduler({ github, context, core });
