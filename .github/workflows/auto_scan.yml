name: Tram Tin Tuc - Auto Scanner

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'quet_vb.py'
      - 'scanner/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'source_config.json'
      - 'danh_sach_nguon.csv'
      - '.github/workflows/auto_scan.yml'

concurrency:
  group: tram-tin-tuc-full-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python modules
        run: |
          python -m compileall -q scanner quet_vb.py
          python -m unittest discover -s tests -v

      - name: Run full-source scanner
        env:
          SHEETS_WEB_APP_URL: ${{ secrets.SHEETS_WEB_APP_URL }}
          SHEETS_API_TOKEN: ${{ secrets.SHEETS_API_TOKEN }}
        run: python quet_vb.py

      - name: Save persistent scanner memory
        if: always()
        run: |
          MEMORY_FILES="data/seen_documents.json data/scan_history.json data/document_relationships.json data/relationship_scan_state.json"
          if [[ -n "$(git status --porcelain $MEMORY_FILES)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p /tmp/scanner-memory-local
            for file in $MEMORY_FILES; do
              if [[ -f "$file" ]]; then
                mkdir -p "/tmp/scanner-memory-local/$(dirname "$file")"
                cp "$file" "/tmp/scanner-memory-local/$file"
              fi
            done

            # Merge JSON state onto the newest main instead of rebasing conflicting JSON blobs.
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              python -m scanner.state_merge --local-dir /tmp/scanner-memory-local --repo-root .
              git add $MEMORY_FILES
              if git diff --cached --quiet; then
                echo "Không có thay đổi bộ nhớ cần lưu."
                exit 0
              fi
              git commit -m "Merge persistent scanner memory [skip ci]"
              if git push origin HEAD:main; then
                echo "Đã hợp nhất và lưu bộ nhớ quét lên main."
                exit 0
              fi
              echo "Push bộ nhớ thất bại lần ${attempt}/3; thử lấy main mới nhất."
              sleep $((attempt * 3))
            done
            echo "Không thể lưu bộ nhớ sau 3 lần thử."
            exit 1
          fi
