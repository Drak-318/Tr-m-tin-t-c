name: Tram Tin Tuc - Auto Scanner

# GitHub-only controller: priority scan no sooner than 5 minutes after the
# previous completion; full scan on a 30-minute cadence with safe catch-up.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Phạm vi quét"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - priority
          - priority_only
          - full_only

permissions:
  actions: write
  contents: write

jobs:
  scan:
    needs: priority-scan
    if: ${{ always() && ((needs.priority-scan.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.profile == 'full') || (github.event_name == 'workflow_dispatch' && inputs.profile == 'full_only')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: tram-tin-tuc-full-scan
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python, tests, configuration and Apps Script syntax
        run: |
          python -m compileall -q scanner quet_vb.py
          python -m json.tool source_config.json > /dev/null
          python -m json.tool priority_sources.json > /dev/null
          python -m unittest discover -s tests -v
          cp apps_script/Code.gs /tmp/Code.js
          node --check /tmp/Code.js

      - name: Run non-priority source scanner
        env:
          SHEETS_WEB_APP_URL: ${{ secrets.SHEETS_WEB_APP_URL }}
          SHEETS_API_TOKEN: ${{ secrets.SHEETS_API_TOKEN }}
          SCAN_PROFILE: remaining
          SCAN_TRIGGER: ${{ github.event.schedule || github.event_name }}
        run: python quet_vb.py

      - name: Save persistent scanner memory
        if: always()
        run: |
          MEMORY_FILES="data/seen_documents.json data/scan_history.json data/document_relationships.json data/relationship_scan_state.json data/review_queue.json data/sheets_export_queue.json data/discovered_sources.json data/source_retry_queue.json data/sheets_bootstrap.json"
          if [[ -n "$(git status --porcelain $MEMORY_FILES)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p /tmp/scanner-memory-local
            for file in $MEMORY_FILES; do
              if [[ -f "$file" ]]; then
                mkdir -p "/tmp/scanner-memory-local/$(dirname "$file")"
                cp "$file" "/tmp/scanner-memory-local/$file"
              fi
            done

            # Merge JSON state onto the newest main instead of rebasing conflicting JSON blobs.
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              python -m scanner.state_merge --local-dir /tmp/scanner-memory-local --repo-root .
              for file in $MEMORY_FILES; do
                if [[ -f "$file" ]]; then git add "$file"; fi
              done
              if git diff --cached --quiet; then
                echo "Không có thay đổi bộ nhớ cần lưu."
                exit 0
              fi
              git commit -m "Merge persistent scanner memory [skip ci]"
              if git push origin HEAD:main; then
                echo "Đã hợp nhất và lưu bộ nhớ quét lên main."
                exit 0
              fi
              echo "Push bộ nhớ thất bại lần ${attempt}/3; thử lấy main mới nhất."
              sleep $((attempt * 3))
            done
            echo "Không thể lưu bộ nhớ sau 3 lần thử."
            exit 1
          fi

  priority-scan:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.profile == 'priority' || inputs.profile == 'full' || inputs.profile == 'priority_only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: tram-tin-tuc-priority-scan
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python, tests, configuration and Apps Script syntax
        run: |
          python -m compileall -q scanner quet_vb.py
          python -m json.tool source_config.json > /dev/null
          python -m json.tool priority_sources.json > /dev/null
          python -m unittest discover -s tests -v
          cp apps_script/Code.gs /tmp/Code.js
          node --check /tmp/Code.js

      - name: Run priority-source scanner
        env:
          SHEETS_WEB_APP_URL: ${{ secrets.SHEETS_WEB_APP_URL }}
          SHEETS_API_TOKEN: ${{ secrets.SHEETS_API_TOKEN }}
          SCAN_PROFILE: priority
          SCAN_TRIGGER: ${{ github.event.schedule || github.event_name }}
        run: python quet_vb.py

      - name: Save persistent scanner memory
        if: always()
        run: |
          MEMORY_FILES="data/seen_documents.json data/scan_history.json data/document_relationships.json data/relationship_scan_state.json data/review_queue.json data/sheets_export_queue.json data/discovered_sources.json data/source_retry_queue.json data/sheets_bootstrap.json"
          if [[ -n "$(git status --porcelain $MEMORY_FILES)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p /tmp/scanner-memory-local
            for file in $MEMORY_FILES; do
              if [[ -f "$file" ]]; then
                mkdir -p "/tmp/scanner-memory-local/$(dirname "$file")"
                cp "$file" "/tmp/scanner-memory-local/$file"
              fi
            done

            # Merge JSON state onto the newest main instead of rebasing conflicting JSON blobs.
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              python -m scanner.state_merge --local-dir /tmp/scanner-memory-local --repo-root .
              for file in $MEMORY_FILES; do
                if [[ -f "$file" ]]; then git add "$file"; fi
              done
              if git diff --cached --quiet; then
                echo "Không có thay đổi bộ nhớ cần lưu."
                exit 0
              fi
              git commit -m "Merge persistent scanner memory [skip ci]"
              if git push origin HEAD:main; then
                echo "Đã hợp nhất và lưu bộ nhớ quét lên main."
                exit 0
              fi
              echo "Push bộ nhớ thất bại lần ${attempt}/3; thử lấy main mới nhất."
              sleep $((attempt * 3))
            done
            echo "Không thể lưu bộ nhớ sau 3 lần thử."
            exit 1
          fi

  schedule-watchdog:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: tram-tin-tuc-scheduler-controller
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check scan health and dispatch a catch-up run when needed
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "auto_scan.yml",
              branch: "main",
              per_page: 30
            });
            const runs = response.data.workflow_runs
              .filter(run => run.id !== context.runId)
              .slice(0, 30);

            // One GitHub controller owns both schedules. It never dispatches
            // while any scan job is queued/running, and measures cooldown from
            // the job's completed_at timestamp (not the dispatch/start time).
            const jobResults = await Promise.all(runs.map(async run => {
              const result = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: run.id, per_page: 30
              });
              return { run, jobs: result.data.jobs };
            }));

            const scanJobs = [];
            for (const entry of jobResults) {
              for (const job of entry.jobs) {
                if (job.name === "priority-scan" || job.name === "scan") {
                  scanJobs.push({
                    run: entry.run,
                    job,
                    profile: job.name === "priority-scan" ? "priority" : "full"
                  });
                }
              }
            }

            const now = Date.now();
            const activeJobs = scanJobs.filter(({ job }) =>
              ["queued", "pending", "in_progress"].includes(job.status)
            );
            const stale = activeJobs.find(({ run, job, profile }) => {
              const reference = job.status === "in_progress"
                ? (job.started_at || run.run_started_at || run.created_at)
                : run.created_at;
              const age = (now - Date.parse(reference)) / 60000;
              const limit = job.status === "in_progress"
                ? (profile === "priority" ? 15 : 50)
                : 20;
              return Number.isFinite(age) && age > limit;
            });

            let action = "WAIT_ACTIVE";
            let reason = "";
            let dispatchedProfile = "";
            let priorityAge = null;
            let fullAge = null;
            if (stale) {
              await github.rest.actions.cancelWorkflowRun({
                owner, repo, run_id: stale.run.id
              });
              action = "CANCEL_STALE";
              reason = `Cancelled stale ${stale.profile} run #${stale.run.run_number}; re-evaluate on next controller tick`;
              core.warning(reason);
            } else if (activeJobs.length) {
              const active = activeJobs[0];
              action = "WAIT_ACTIVE";
              reason = `${active.profile} run #${active.run.run_number} is ${active.job.status}; no duplicate dispatch`;
              core.info(reason);
            } else {
              const latestCompleted = profile => scanJobs
                .filter(row => row.profile === profile && row.job.completed_at)
                .sort((a, b) => Date.parse(b.job.completed_at) - Date.parse(a.job.completed_at))[0] || null;

              const priorityLast = latestCompleted("priority");
              const fullLast = latestCompleted("full");
              priorityAge = priorityLast ? (now - Date.parse(priorityLast.job.completed_at)) / 60000 : Number.POSITIVE_INFINITY;
              fullAge = fullLast ? (now - Date.parse(fullLast.job.completed_at)) / 60000 : Number.POSITIVE_INFINITY;
              // Priority repeats no sooner than 5 minutes after completion.
              // Full retains its 30-minute cadence; after a failed full scan,
              // retry after a 5-minute post-completion cooldown.
              const priorityDue = priorityAge >= 5;
              const fullInterval = fullLast && fullLast.job.conclusion !== "success" ? 5 : 30;
              const fullDue = fullAge >= Math.max(5, fullInterval);
              const latestAnyCompleted = scanJobs
                .filter(row => row.job.completed_at)
                .sort((a, b) => Date.parse(b.job.completed_at) - Date.parse(a.job.completed_at))[0] || null;
              const globalCooldownAge = latestAnyCompleted
                ? (now - Date.parse(latestAnyCompleted.job.completed_at)) / 60000
                : Number.POSITIVE_INFINITY;

              if (globalCooldownAge < 5) {
                action = "POST_COMPLETION_COOLDOWN";
                reason = `Last scan completed ${Math.round(globalCooldownAge)}m ago; wait until 5 minutes after completion`;
              } else if (priorityDue) {
                dispatchedProfile = "priority_only";
                action = "DISPATCH_PRIORITY";
                reason = `No active scan; last priority completion: ${Number.isFinite(priorityAge) ? Math.round(priorityAge) + "m ago" : "not found"}`;
              } else if (fullDue) {
                dispatchedProfile = "full_only";
                action = "DISPATCH_FULL";
                reason = `No active scan; last full completion: ${Number.isFinite(fullAge) ? Math.round(fullAge) + "m ago" : "not found"}`;
              } else {
                action = "COOLDOWN";
                reason = `Priority completed ${Math.round(priorityAge)}m ago; full completed ${Math.round(fullAge)}m ago`;
              }

              if (dispatchedProfile) {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: "auto_scan.yml", ref: "main",
                  inputs: { profile: dispatchedProfile }
                });
                core.info(`GitHub accepted ${dispatchedProfile}; next controller tick verifies job creation.`);
              }
            }

            await core.summary
              .addHeading("Trạm Tin Tức – Bộ điều phối GitHub")
              .addTable([
                [{data: "Thông tin", header: true}, {data: "Giá trị", header: true}],
                ["Hành động", action],
                ["Lý do", reason],
                ["Lượt được gửi", dispatchedProfile || "Không gửi lệnh"],
                ["Tuổi lượt ưu tiên (phút)", Number.isFinite(priorityAge) ? String(Math.round(priorityAge)) : "Chưa có"],
                ["Tuổi lượt toàn bộ (phút)", Number.isFinite(fullAge) ? String(Math.round(fullAge)) : "Chưa có"],
                ["Job đang hoạt động", String(activeJobs.length)]
              ])
              .write();
            core.info(`Scheduler decision: ${action}. ${reason}`);
