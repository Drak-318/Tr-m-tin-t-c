name: Tram Tin Tuc - Auto Scanner

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'quet_vb.py'
      - 'scanner/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'source_config.json'
      - 'danh_sach_nguon.csv'
      - '.github/workflows/auto_scan.yml'

concurrency:
  group: tram-tin-tuc-full-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python modules
        run: |
          python -m compileall -q scanner quet_vb.py
          python -m unittest discover -s tests -v

      - name: Run full-source scanner
        env:
          SHEETS_WEB_APP_URL: ${{ secrets.SHEETS_WEB_APP_URL }}
          SHEETS_API_TOKEN: ${{ secrets.SHEETS_API_TOKEN }}
        run: python quet_vb.py

      - name: Save persistent anti-duplicate memory
        if: always()
        run: |
          if [[ -n "$(git status --porcelain data/seen_documents.json data/scan_history.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/seen_documents.json data/scan_history.json
            git commit -m "Update scanner memory [skip ci]"

            # Rebase bộ nhớ lên nhánh mới nhất để tránh lỗi non-fast-forward
            # khi có commit cấu hình/mã nguồn trong lúc lượt quét đang chạy.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Không thể rebase bộ nhớ do xung đột; giữ nguyên dữ liệu trên remote."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Đã lưu bộ nhớ bền vững lên main."
                exit 0
              fi
              echo "Push bộ nhớ thất bại lần ${attempt}/3; sẽ lấy main mới nhất và thử lại."
              sleep $((attempt * 3))
            done
            echo "Không thể lưu bộ nhớ sau 3 lần thử."
            exit 1
          fi
